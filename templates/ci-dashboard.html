<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aruvici · Delivery</title>
<style>body{font:15px system-ui;margin:0;background:#10151e;color:#e8eef9}header{padding:28px 5%;border-bottom:1px solid #344155}h1{font-size:24px;margin:0 0 8px}p{color:#a9b7cb}main{display:grid;grid-template-columns:300px 1fr;gap:24px;padding:24px 5%}button{display:block;width:100%;text-align:left;background:#1c2738;color:inherit;border:1px solid #344155;border-radius:8px;padding:16px;margin:8px 0;cursor:pointer}button:focus,button:hover{border-color:#58c5be}article{min-width:0}section{background:#17202e;padding:20px;border-radius:10px;margin:14px 0}.stages{display:flex;flex-wrap:wrap;gap:8px}.stage{background:#26354a;padding:12px;border-radius:6px}.passed,.succeeded{color:#6ee7b7}.failed,.timed_out{color:#fda4af}.blocked,.pending{color:#fcd34d}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a9b7cb;font-size:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #344155}small{color:#a9b7cb}@media(max-width:750px){main{grid-template-columns:1fr}}</style>
<header><h1>Aruvici / Local delivery</h1><small>Read-only snapshot · Regenerate with aruvici ci dashboard · Production promotion stays in your terminal</small></header>
<main><nav aria-label="Build runs" id="runs"></nav><article id="detail"><h2>Select a build</h2><p>Stage history, captured artifacts and provenance are recorded locally.</p></article></main>
<script type="application/json" id="data">__RUN_DATA__</script><script>
const runs=JSON.parse(document.querySelector('#data').textContent),nav=document.querySelector('#runs'),detail=document.querySelector('#detail');
function el(tag,text,parent,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;if(parent)parent.append(n);return n;}
function show(run){detail.replaceChildren();el('h2',`${run.target} · Build #${run.id}`,detail);el('p',`${run.status} · ${run.created_at}`,detail,run.status);const flow=el('section',undefined,detail,'stages');for(const stage of run.stages){const item=el('div',undefined,flow,'stage');el('strong',stage.name,item);el('div',stage.status,item,stage.status);}if(run.error)el('pre',run.error,el('section',undefined,detail));
const artifacts=el('section',undefined,detail);el('h3','Artifacts & evidence',artifacts);if(!run.artifacts.length)el('p','No artifacts captured yet.',artifacts);for(const a of run.artifacts){el('h4',`${a.kind} · ${a.stage} · ${a.size} bytes`,artifacts);el('pre',`Artifact #${a.id}\nSHA-256 ${a.sha256}\nInspect: aruvici ci artifact ${a.id}`,artifacts);}
const provenance=el('section',undefined,detail);el('h3','Provenance',provenance);el('pre',JSON.stringify({commit:run.commit,plan_digest:run.plan_digest,context:run.context},null,2),provenance);
const stages=el('section',undefined,detail);el('h3','Stage details',stages);for(const stage of run.stages){el('h4',stage.name,stages);el('pre',JSON.stringify(stage.details,null,2),stages);} }
el('h2','Build history',nav);if(!runs.length)el('p','Queue your first approved target to begin.',nav);for(const run of runs){const b=el('button',`#${run.id} ${run.target} · ${run.status}`,nav);b.onclick=()=>show(run);}if(runs.length)show(runs[0]);
</script></html>
