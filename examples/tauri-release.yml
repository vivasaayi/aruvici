# Generated by aruvici. Install the approved manager binary/config outside repos.
# No PR events: even private repository code must be trusted on this machine.
name: Tauri release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tauri-release
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'YOUR_ORG/notes' &&
      github.event.repository.private == true &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: [self-hosted, macOS, ARM64, tauri]
    timeout-minutes: 90
    env:
      ARUVICI_BIN: ${{ vars.ARUVICI_BIN }}
      ARUVICI_CONFIG: ${{ vars.ARUVICI_CONFIG }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          clean: false
          fetch-depth: 0
      - name: Validate trusted manager installation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARUVICI_BIN" = /* && -x "$ARUVICI_BIN" ]]
          [[ "$ARUVICI_CONFIG" = /* && -f "$ARUVICI_CONFIG" ]]
          "$ARUVICI_BIN" --config "$ARUVICI_CONFIG" validate
      - name: npm ci, frontend build, cargo test, ARM64 Tauri build, sign, verify, ZIP and SHA-256
        id: release
        shell: bash
        run: |
          set -euo pipefail
          "$ARUVICI_BIN" --config "$ARUVICI_CONFIG" build notes \
            --repository "$GITHUB_WORKSPACE" --reference "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload verified release and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notes-${{ github.sha }}-macos
          path: ${{ steps.release.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 30
# Promotion is intentionally absent. Download/review and use interactive deploy.
