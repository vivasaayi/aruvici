[package]
name = "aruvici"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local Tauri build and manual promotion manager for macOS"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

